apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: mlops
spec:
  
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      shareProcessNamespace: true
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: nginx

      initContainers:
      - name: init-done
        image: busybox:1.36
        command: ["sh", "-c", "echo fail; exit 1"]

      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        command: ["sh", "-c"]
        args:
        - |
          echo "hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')" > /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'

      - name: time-updater
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          while true; do
            PID=$(pgrep -o -f '[n]ginx: master')
            if [ -n "$PID" ]; then
              echo "hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')" > /proc/$PID/root/usr/share/nginx/html/index.html
            fi
            sleep 5
          done

      dnsPolicy: ClusterFirst
      restartPolicy: Always