apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  creationTimestamp: null
  name: webapp-ingress
  namespace: webapp-stack
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - backend:
          service:
            name: webapp-api
            port:
              number: 80
        path: /
        pathType: Prefix
status:
  loadBalancer: {}
